<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Kepegawaian | SIMAK SD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SIMAK SD - Sistem Kepegawaian</h1>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="kepegawaian.html" class="active">Kepegawaian</a>
      <a href="manajemen-aset.html">Manajemen Aset</a>
      <a href="laporan.html">Laporan</a>
      <a href="kontak.html">Kontak</a>
    </nav>
  </header>

  <main class="container">
    <h2>Form Input Data Kepegawaian</h2>
    <form id="formKepegawaian" class="form-grid">
      <label>Nama Pegawai</label>
      <input type="text" name="nama" required>
      
      <label>Jabatan</label>
      <input type="text" name="jabatan" required>
      
      <label>Tanggal Masuk</label>
      <input type="date" name="tanggalMasuk" required onchange="hitungMasaKerja()">
      
      <label>Masa Kerja (Tahun)</label>
      <input type="text" name="masaKerja" readonly>
      
      <label>Riwayat Jabatan</label>
      <textarea name="riwayatJabatan" rows="2"></textarea>
      
      <label>Kompensasi / Remunerasi</label>
      <input type="text" name="kompensasi">
      
      <label>Catatan Kasus / Pelanggaran</label>
      <textarea name="pelanggaran" rows="2"></textarea>
      
      <label>Sanksi Pernah Diterima</label>
      <textarea name="sanksi" rows="2"></textarea>

      <button type="submit">Tambah Data</button>
    </form>

    <h3>Data Kepegawaian</h3>
    <button onclick="downloadExcel()">Download Excel</button>
    <div class="table-container">
      <table id="tabelKepegawaian">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Jabatan</th>
            <th>Tgl Masuk</th>
            <th>Masa Kerja</th>
            <th>Riwayat Jabatan</th>
            <th>Kompensasi</th>
            <th>Pelanggaran</th>
            <th>Sanksi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 SIMAK SD - Developed by CV. Mitra Utama Consultindo</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    function hitungMasaKerja() {
      const tgl = document.querySelector("input[name='tanggalMasuk']").value;
      if (!tgl) return;
      const masuk = new Date(tgl);
      const sekarang = new Date();
      let tahun = sekarang.getFullYear() - masuk.getFullYear();
      if (
        sekarang.getMonth() < masuk.getMonth() || 
        (sekarang.getMonth() === masuk.getMonth() && sekarang.getDate() < masuk.getDate())
      ) {
        tahun--;
      }
      document.querySelector("input[name='masaKerja']").value = tahun;
    }

    document.getElementById('formKepegawaian').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(this);
      const tbody = document.querySelector('#tabelKepegawaian tbody');
      const row = document.createElement('tr');

      for (let key of ['nama', 'jabatan', 'tanggalMasuk', 'masaKerja', 'riwayatJabatan', 'kompensasi', 'pelanggaran', 'sanksi']) {
        const td = document.createElement('td');
        td.textContent = data.get(key);
        row.appendChild(td);
      }
      tbody.appendChild(row);
      this.reset();
    });

    function downloadExcel() {
      const wb = XLSX.utils.table_to_book(document.getElementById('tabelKepegawaian'), {sheet: "Kepegawaian"});
      XLSX.writeFile(wb, 'Data_Kepegawaian.xlsx');
    }
  </script>
</body>
</html>
