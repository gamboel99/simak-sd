<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIMAK SD - Kepegawaian</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>Sistem Informasi Manajemen Kepegawaian & Aset Sekolah</h1>
  </header>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="kepegawaian.html" class="active">Kepegawaian</a></li>
      <li><a href="aset.html">Manajemen Aset</a></li>
      <li><a href="laporan.html">Laporan</a></li>
      <li><a href="kontak.html">Kontak</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Formulir Kepegawaian</h2>
    <form id="formKepegawaian">
      <label>Nama:</label>
      <input type="text" id="nama" required>
      <label>Jabatan:</label>
      <input type="text" id="jabatan" required>
      <label>Tanggal Masuk:</label>
      <input type="date" id="tanggalMasuk" required>
      <label>Status Kepegawaian:</label>
      <select id="status">
        <option value="PNS">PNS</option>
        <option value="GTY">GTY</option>
        <option value="Honor">Honor</option>
        <option value="PKL">PKL</option>
        <option value="Magang">Magang</option>
      </select>
      <button type="submit">Simpan</button>
    </form>

    <h3>Data Kepegawaian</h3>
    <table id="tabelKepegawaian">
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Jabatan</th>
          <th>Tanggal Masuk</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button onclick="exportToExcel()">Unduh Data Excel</button>
  </div>

  <footer>
    <p>&copy; e-Sekolah | SIMAK-SD Develop By CV Mitra Utama Consultindo</p>
  </footer>

  <script>
    let dataPegawai = [];
    const form = document.getElementById("formKepegawaian");
    const tabel = document.getElementById("tabelKepegawaian").getElementsByTagName("tbody")[0];

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const nama = document.getElementById("nama").value;
      const jabatan = document.getElementById("jabatan").value;
      const tanggal = document.getElementById("tanggalMasuk").value;
      const status = document.getElementById("status").value;

      const newRow = {
        Nama: nama,
        Jabatan: jabatan,
        "Tanggal Masuk": tanggal,
        Status: status
      };
      dataPegawai.push(newRow);
      renderTable();
      form.reset();
    });

    function renderTable() {
      tabel.innerHTML = "";
      dataPegawai.forEach((item, index) => {
        const row = tabel.insertRow();
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.Nama}</td>
          <td>${item.Jabatan}</td>
          <td>${item["Tanggal Masuk"]}</td>
          <td>${item.Status}</td>
        `;
      });
    }

    function exportToExcel() {
      const ws = XLSX.utils.json_to_sheet(dataPegawai);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Kepegawaian");
      XLSX.writeFile(wb, "data_kepegawaian.xlsx");
    }
  </script>
</body>
</html>
