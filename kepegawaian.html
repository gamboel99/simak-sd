<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Kepegawaian - e-Sekolah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sistem Kepegawaian Sekolah</h1>
  </header>

  <nav>
    <ul class="menu">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="kepegawaian.html" class="active">Kepegawaian</a></li>
      <li><a href="manajemen-aset.html">Manajemen Aset</a></li>
      <li><a href="laporan.html">Laporan</a></li>
      <li><a href="kontak.html">Kontak</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Form Data Pegawai</h2>
    <form id="formPegawai">
      <div class="form-grid">
        <label>Nama Lengkap</label><input type="text" name="nama" required>
        <label>NIP</label><input type="text" name="nip">
        <label>Jabatan</label><input type="text" name="jabatan">
        <label>Tanggal Mulai Kerja</label><input type="date" name="tgl_masuk" id="tglMasuk" required>
        <label>Masa Kerja (tahun)</label><input type="text" id="masaKerja" readonly>
        <label>Catatan Kasus / Sanksi</label><input type="text" name="catatan">
        <label>Keterangan</label><input type="text" name="keterangan">
      </div>
      <button type="submit">Simpan</button>
    </form>

    <h2>Data Pegawai</h2>
    <button onclick="downloadExcel()">Download Excel</button>
    <div class="table-container">
      <table id="tabelPegawai">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIP</th>
            <th>Jabatan</th>
            <th>Tgl Masuk</th>
            <th>Masa Kerja</th>
            <th>Catatan</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 e-Sekolah | Sistem Kepegawaian</p>
  </footer>

  <script>
    const form = document.getElementById('formPegawai');
    const tabel = document.querySelector('#tabelPegawai tbody');
    const tglMasuk = document.getElementById('tglMasuk');
    const masaKerjaInput = document.getElementById('masaKerja');

    tglMasuk.addEventListener('change', () => {
      const masuk = new Date(tglMasuk.value);
      const now = new Date();
      const tahun = now.getFullYear() - masuk.getFullYear();
      masaKerjaInput.value = tahun >= 0 ? tahun : 0;
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(form);
      const row = tabel.insertRow();
      row.insertCell().textContent = tabel.rows.length;
      row.insertCell().textContent = data.get('nama');
      row.insertCell().textContent = data.get('nip');
      row.insertCell().textContent = data.get('jabatan');
      row.insertCell().textContent = data.get('tgl_masuk');
      row.insertCell().textContent = document.getElementById('masaKerja').value;
      row.insertCell().textContent = data.get('catatan');
      row.insertCell().textContent = data.get('keterangan');
      form.reset();
      masaKerjaInput.value = '';
    });

    function downloadExcel() {
      let table = document.getElementById("tabelPegawai");
      let html = table.outerHTML.replace(/ /g, '%20');
      let filename = 'data_kepegawaian.xls';
      let link = document.createElement('a');
      link.href = 'data:application/vnd.ms-excel,' + html;
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>
