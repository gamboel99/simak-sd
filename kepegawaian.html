<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Kepegawaian</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f8ff;
      color: #003366;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #002f6c;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    h2 {
      color: #002f6c;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    label {
      font-weight: bold;
    }

    input, select, textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
    }

    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      background-color: #004b8d;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #003366;
    }

    table {
      width: 100%;
      margin-top: 2rem;
      border-collapse: collapse;
      font-size: 14px;
    }

    table, th, td {
      border: 1px solid #aaa;
    }

    th, td {
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #d9e9ff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistem Kepegawaian - e-Sekolah</h1>
  </header>

  <main>
    <h2>Form Input Data Pegawai</h2>
    <form id="formKepegawaian">
      <div><label>Nama</label><input type="text" id="nama" required></div>
      <div><label>NIP</label><input type="text" id="nip" required></div>
      <div><label>Jabatan</label><input type="text" id="jabatan"></div>
      <div><label>Unit Kerja</label><input type="text" id="unit"></div>
      <div><label>Tanggal Masuk</label><input type="date" id="masuk"></div>
      <div><label>Status</label><select id="status"><option>PNS</option><option>Honorer</option><option>Kontrak</option></select></div>
      <div><label>Tanggal Resign</label><input type="date" id="resign"></div>
      <div><label>Prestasi</label><input type="text" id="prestasi"></div>
      <div><label>Gaji</label><input type="number" id="gaji"></div>
      <div><label>Jatah Cuti</label><input type="number" id="cuti" value="12"></div>
      <div><label>Cuti Terpakai</label><input type="number" id="terpakai" value="0"></div>
      <div><label>Jumlah Keluarga</label><input type="number" id="keluarga"></div>
      <div><label>Alamat</label><textarea id="alamat"></textarea></div>
      <div><label>Telepon</label><input type="text" id="telp"></div>
      <div><label>Email</label><input type="email" id="email"></div>
    </form>
    <button onclick="tambahData()">Simpan Data</button>
    <button onclick="unduhExcel()">Unduh Excel</button>

    <table id="tabelKepegawaian">
      <thead>
        <tr>
          <th>Nama</th><th>NIP</th><th>Jabatan</th><th>Unit</th><th>Masuk</th><th>Status</th><th>Resign</th><th>Prestasi</th><th>Gaji</th><th>Sisa Cuti</th><th>Keluarga</th><th>Alamat</th><th>Telepon</th><th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const dataPegawai = [];

    function tambahData() {
      const form = document.getElementById("formKepegawaian");
      const data = {
        Nama: form.nama.value,
        NIP: form.nip.value,
        Jabatan: form.jabatan.value,
        Unit: form.unit.value,
        Masuk: form.masuk.value,
        Status: form.status.value,
        Resign: form.resign.value,
        Prestasi: form.prestasi.value,
        Gaji: form.gaji.value,
        SisaCuti: form.cuti.value - form.terpakai.value,
        Keluarga: form.keluarga.value,
        Alamat: form.alamat.value,
        Telepon: form.telp.value,
        Email: form.email.value
      };

      dataPegawai.push(data);

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.Nama}</td>
        <td>${data.NIP}</td>
        <td>${data.Jabatan}</td>
        <td>${data.Unit}</td>
        <td>${data.Masuk}</td>
        <td>${data.Status}</td>
        <td>${data.Resign}</td>
        <td>${data.Prestasi}</td>
        <td>${data.Gaji}</td>
        <td>${data.SisaCuti}</td>
        <td>${data.Keluarga}</td>
        <td>${data.Alamat}</td>
        <td>${data.Telepon}</td>
        <td>${data.Email}</td>
      `;
      document.querySelector("#tabelKepegawaian tbody").appendChild(row);
      form.reset();
    }

    function unduhExcel() {
      if (dataPegawai.length === 0) {
        alert("Belum ada data pegawai!");
        return;
      }

      const header = Object.keys(dataPegawai[0]);
      const rows = dataPegawai.map(obj => header.map(k => obj[k]));

      let csvContent = "data:text/csv;charset=utf-8," + header.join(",") + "\n" +
                       rows.map(e => e.join(",")).join("\n");

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "data_kepegawaian.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
