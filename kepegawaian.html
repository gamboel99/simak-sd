<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepegawaian | SIMAK-SD</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fff;
      color: #333;
    }

    header {
      background-color: #d32f2f;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #f44336;
    }

    nav a {
      color: white;
      padding: 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #b71c1c;
    }

    main {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .form-container {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input,
    select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-actions {
      margin-top: 1.5rem;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }

    table,
    th,
    td {
      border: 1px solid #ddd;
    }

    th,
    td {
      padding: 0.75rem;
      text-align: left;
    }

    th {
      background-color: #f44336;
      color: white;
    }

    footer {
      background-color: #d32f2f;
      color: white;
      text-align: center;
      padding: 1rem;
      position: relative;
      margin-top: 4rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>SIMAK-SD</h1>
    <p>Manajemen Kepegawaian Sekolah</p>
  </header>
  <nav>
    <a href="index.html">Beranda</a>
    <a href="kepegawaian.html">Kepegawaian</a>
    <a href="manajemen-aset.html">Manajemen Aset</a>
    <a href="laporan.html">Laporan</a>
    <a href="kontak.html">Kontak</a>
  </nav>

  <main>
    <div class="form-container">
      <h2>Input Data Kepegawaian</h2>
      <form id="formKepegawaian">
        <label>Nama Lengkap</label>
        <input type="text" id="nama">

        <label>NIP</label>
        <input type="text" id="nip">

        <label>Jabatan</label>
        <input type="text" id="jabatan">

        <label>Unit Kerja</label>
        <input type="text" id="unit">

        <label>Status Kepegawaian</label>
        <select id="status">
          <option value="PNS">PNS</option>
          <option value="Honorer">Honorer</option>
          <option value="PPPK">PPPK</option>
        </select>

        <label>Tanggal Resign</label>
        <input type="date" id="resign">

        <label>Prestasi</label>
        <input type="text" id="prestasi">

        <label>Gaji</label>
        <input type="number" id="gaji">

        <label>Cuti Tahunan</label>
        <input type="number" id="cuti" value="12">

        <label>Cuti Terpakai</label>
        <input type="number" id="terpakai" value="0">

        <label>Jumlah Keluarga</label>
        <input type="number" id="keluarga">

        <label>Alamat</label>
        <input type="text" id="alamat">

        <label>Telepon</label>
        <input type="text" id="telp">

        <label>Email</label>
        <input type="email" id="email">

        <div class="form-actions">
          <button type="button" onclick="tambahData()">Simpan</button>
        </div>
      </form>
    </div>

    <table id="tabelKepegawaian">
      <thead>
        <tr>
          <th>Nama</th>
          <th>NIP</th>
          <th>Jabatan</th>
          <th>Unit</th>
          <th>Status</th>
          <th>Resign</th>
          <th>Prestasi</th>
          <th>Gaji</th>
          <th>Sisa Cuti</th>
          <th>Keluarga</th>
          <th>Alamat</th>
          <th>Telp</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>
    SIMAK-SD Develop By CV Mitra Utama Consultindo
  </footer>

  <script>
    function tambahData() {
      const nama = document.getElementById('nama').value;
      const nip = document.getElementById('nip').value;
      const jabatan = document.getElementById('jabatan').value;
      const unit = document.getElementById('unit').value;
      const status = document.getElementById('status').value;
      const resign = document.getElementById('resign').value;
      const prestasi = document.getElementById('prestasi').value;
      const gaji = document.getElementById('gaji').value;
      const cuti = parseInt(document.getElementById('cuti').value);
      const terpakai = parseInt(document.getElementById('terpakai').value);
      const sisaCuti = cuti - terpakai;
      const keluarga = document.getElementById('keluarga').value;
      const alamat = document.getElementById('alamat').value;
      const telp = document.getElementById('telp').value;
      const email = document.getElementById('email').value;

      const tbody = document.getElementById('tabelKepegawaian').querySelector('tbody');
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${nama}</td>
        <td>${nip}</td>
        <td>${jabatan}</td>
        <td>${unit}</td>
        <td>${status}</td>
        <td>${resign}</td>
        <td>${prestasi}</td>
        <td>${gaji}</td>
        <td>${sisaCuti}</td>
        <td>${keluarga}</td>
        <td>${alamat}</td>
        <td>${telp}</td>
        <td>${email}</td>
      `;

      document.getElementById('formKepegawaian').reset();
    }
  </script>
</body>

</html>
