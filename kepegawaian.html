
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIMAK SD - Kepegawaian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Manajemen Kepegawaian</h1>
  </header>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="kepegawaian.html" class="active">Kepegawaian</a></li>
      <li><a href="aset.html">Manajemen Aset</a></li>
      <li><a href="laporan.html">Laporan</a></li>
      <li><a href="kontak.html">Kontak</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Input Data Kepegawaian</h2>
    <form id="pegawaiForm">
      <input type="text" placeholder="Nama" required />
      <input type="text" placeholder="NIP" />
      <input type="text" placeholder="Jabatan" />
      <input type="text" placeholder="Unit" />
      <input type="date" placeholder="Tanggal Masuk" />
      <select>
        <option value="">Pilih Status Kepegawaian</option>
        <option value="PNS">PNS</option>
        <option value="Honorer">Honorer</option>
        <option value="GTY">GTY</option>
        <option value="PKL">PKL</option>
        <option value="Magang">Magang</option>
      </select>
      <input type="date" placeholder="Tanggal Resign (opsional)" />
      <input type="text" placeholder="Prestasi" />
      <input type="number" placeholder="Gaji" />
      <input type="number" placeholder="Sisa Cuti" />
      <input type="text" placeholder="Jumlah Keluarga" />
      <input type="text" placeholder="Alamat" />
      <input type="tel" placeholder="Telepon" />
      <input type="email" placeholder="Email" />
      <button type="submit">Simpan & Tambah</button>
    </form>

    <button onclick="unduhExcel()">Unduh Excel Workbook</button>

    <table id="tabelPegawai">
      <thead>
        <tr>
          <th>Nama</th><th>NIP</th><th>Jabatan</th><th>Unit</th><th>Masuk</th><th>Status</th>
          <th>Resign</th><th>Prestasi</th><th>Gaji</th><th>Sisa Cuti</th><th>Keluarga</th>
          <th>Alamat</th><th>Telepon</th><th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>
    <p>&copy; e-Sekolah | SIMAK-SD Develop By CV Mitra Utama Consultindo</p>
  </footer>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mini.min.js"></script>
  <script>
    const form = document.getElementById("pegawaiForm");
    const tbody = document.querySelector("#tabelPegawai tbody");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const data = Array.from(form.elements).slice(0, 14).map(el => el.value.trim());
      const tr = document.createElement("tr");
      data.forEach(val => {
        const td = document.createElement("td");
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
      form.reset();
    });

    function unduhExcel() {
      const wb = XLSX.utils.book_new();
      const rows = [["Nama", "NIP", "Jabatan", "Unit", "Masuk", "Status", "Resign", "Prestasi", "Gaji", "Sisa Cuti", "Keluarga", "Alamat", "Telepon", "Email"]];
      document.querySelectorAll("#tabelPegawai tbody tr").forEach(tr => {
        const row = Array.from(tr.children).map(td => td.textContent);
        rows.push(row);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, "Data Kepegawaian");
      XLSX.writeFile(wb, "data_kepegawaian.xlsx");
    }
  </script>
</body>
</html>
