
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kepegawaian | SIMAK-SD</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --biru-korpri: #003366;
      --biru-korpri-tua: #002244;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fff;
      color: #333;
    }

    header {
      background: linear-gradient(to right, var(--biru-korpri), #005599);
      color: white;
      padding: 1.5rem;
      text-align: center;
      position: relative;
    }

    header::after {
      content: "";
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/97/Garuda_Pancasila.svg');
      background-size: 60px;
      background-repeat: no-repeat;
      background-position: top right;
      position: absolute;
      top: 10px;
      right: 20px;
      width: 60px;
      height: 60px;
      opacity: 0.2;
    }

    nav {
      background-color: var(--biru-korpri);
      text-align: center;
    }

    nav a {
      color: white;
      padding: 1rem 1.5rem;
      display: inline-block;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover,
    nav a.active {
      background-color: var(--biru-korpri-tua);
    }

    .download-link {
      display: inline-block;
      margin: 1rem;
      background-color: var(--biru-korpri);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
    }

    .download-link:hover {
      background-color: var(--biru-korpri-tua);
    }

    main {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .form-container {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-actions {
      margin-top: 1.5rem;
      text-align: right;
    }

    .form-actions button {
      padding: 0.7rem 1.5rem;
      background-color: var(--biru-korpri);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: var(--biru-korpri-tua);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      text-align: left;
    }

    th {
      background-color: var(--biru-korpri);
      color: white;
    }

    footer {
      background-color: var(--biru-korpri-tua);
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistem Informasi Manajemen Kepegawaian & Aset Sekolah (SIMAK-SD)</h1>
    <p>Manajemen Kepegawaian Sekolah</p>
  </header>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="kepegawaian.html" class="active">Kepegawaian</a>
    <a href="manajemen-aset.html">Manajemen Aset</a>
    <a href="laporan.html">Laporan</a>
    <a href="kontak.html">Kontak</a>
  </nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const dataPegawai = [];

  function tambahData() {
    const nama = document.getElementById('nama').value;
    const nip = document.getElementById('nip').value;
    const jabatan = document.getElementById('jabatan').value;
    const unit = document.getElementById('unit').value;
    const masuk = document.getElementById('masuk').value;
    const status = document.getElementById('status').value;
    const resign = document.getElementById('resign').value;
    const prestasi = document.getElementById('prestasi').value;
    const gaji = document.getElementById('gaji').value;
    const cuti = parseInt(document.getElementById('cuti').value);
    const terpakai = parseInt(document.getElementById('terpakai').value);
    const sisaCuti = cuti - terpakai;
    const keluarga = document.getElementById('keluarga').value;
    const alamat = document.getElementById('alamat').value;
    const telp = document.getElementById('telp').value;
    const email = document.getElementById('email').value;

    const data = {
      Nama: nama,
      NIP: nip,
      Jabatan: jabatan,
      "Unit Kerja": unit,
      "Tanggal Masuk": masuk,
      Status: status,
      "Tanggal Resign": resign,
      Prestasi: prestasi,
      Gaji: gaji,
      "Sisa Cuti": sisaCuti,
      "Jumlah Keluarga": keluarga,
      Alamat: alamat,
      Telepon: telp,
      Email: email
    };

    dataPegawai.push(data);

    const tbody = document.getElementById('tabelKepegawaian').querySelector('tbody');
    const row = tbody.insertRow();
    row.innerHTML = `
      <td>${nama}</td>
      <td>${nip}</td>
      <td>${jabatan}</td>
      <td>${unit}</td>
      <td>${masuk}</td>
      <td>${status}</td>
      <td>${resign}</td>
      <td>${prestasi}</td>
      <td>${gaji}</td>
      <td>${sisaCuti}</td>
      <td>${keluarga}</td>
      <td>${alamat}</td>
      <td>${telp}</td>
      <td>${email}</td>
    `;

    document.getElementById('formKepegawaian').reset();
  }

  function unduhExcel() {
    if (dataPegawai.length === 0) {
      alert("Belum ada data untuk diunduh.");
      return;
    }

    const worksheet = XLSX.utils.json_to_sheet(dataPegawai);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Data Pegawai");

    XLSX.writeFile(workbook, "data_kepegawaian.xlsx");
  }
</script>
