<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kontak | SIMAK SD</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    header, footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
    nav {
      background-color: #005599;
      padding: 0.5rem;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 0 1rem;
    }
    .contact-info, .contact-form {
      flex: 1 1 45%;
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .contact-info h2,
    .contact-form h2 {
      margin-top: 0;
    }
    .contact-info p {
      margin: 0.5rem 0;
    }
    .contact-info i {
      color: #005599;
      margin-right: 0.5rem;
    }
    form label {
      display: block;
      margin-top: 1rem;
    }
    form input, form textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    form button {
      margin-top: 1rem;
      background-color: #005599;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    form button:hover {
      background-color: #004080;
    }
    iframe {
      width: 100%;
      height: 250px;
      border: 0;
      margin-top: 1rem;
      border-radius: 8px;
    }
    footer {
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sistem Informasi Manajemen Kepegawaian & Aset Sekolah (SIMAK-SD)</h1>
  </header>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="kepegawaian.html">Kepegawaian</a>
    <a href="manajemen-aset.html">Manajemen Aset</a>
    <a href="laporan.html">Laporan</a>
    <a href="kontak.html">Kontak</a>
  </nav>

  <div class="container">
    <div class="contact-info">
      <h2><i class="bi bi-info-circle-fill"></i> Informasi Kontak</h2>
      <p><i class="bi bi-geo-alt-fill"></i> Jl. Pendidikan No. 88, Kediri, Jawa Timur</p>
      <p><i class="bi bi-telephone-fill"></i> (0354) 123456</p>
      <p><i class="bi bi-envelope-fill"></i> info@simak-sd.sch.id</p>
      <p><i class="bi bi-globe2"></i> www.simak-sd.vercel.app</p>
      <iframe src="https://maps.google.com/maps?q=Kediri&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
    </div>

    <div class="contact-form">
      <h2><i class="bi bi-chat-dots-fill"></i> Kirim Pesan</h2>
      <form>
        <label for="name">Nama</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Pesan</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Kirim</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 SIMAK-SD. Seluruh Hak Cipta Dilindungi.</p>
  </footer>

</body>
</html>
