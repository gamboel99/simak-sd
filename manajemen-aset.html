<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Aset | SIMAK-SD</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f9ff;
      color: #333;
    }

    header {
      background-color: #00527a;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
    }

    .nav-menu li a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .nav-menu li a:hover,
    .nav-menu li a.active {
      background-color: #007e6a;
    }

    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      color: #00527a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .form-grid div {
      display: flex;
      flex-direction: column;
    }

    .form-grid label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-grid input, .form-grid select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .form-actions button {
      background-color: #00527a;
      color: white;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-actions button:hover {
      background-color: #007e6a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #00527a;
      color: white;
    }

    footer {
      background-color: #003f5f;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>SIMAK-SD</h1>
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="kepegawaian.html">Kepegawaian</a></li>
        <li><a href="manajemen-aset.html" class="active">Manajemen Aset</a></li>
        <li><a href="laporan.html">Laporan</a></li>
        <li><a href="kontak.html">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2>Manajemen Aset Sekolah</h2>
    <form id="asetForm" class="form-grid">
      <div><label>ID Barang</label><input type="text" name="id" required></div>
      <div><label>Nama Barang</label><input type="text" name="nama" required></div>
      <div>
        <label>Kategori</label>
        <select name="kategori" required>
          <option value="">Pilih</option>
          <option>Elektronik</option>
          <option>Peralatan Kelas</option>
          <option>Inventaris Kantor</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select name="status" required>
          <option value="">Pilih</option>
          <option>Sewa</option>
          <option>Beli</option>
          <option>Pinjam</option>
        </select>
      </div>
      <div><label>Harga Beli (Rp)</label><input type="number" name="harga" required></div>
      <div><label>Umur Ekonomis (tahun)</label><input type="number" name="umur" required></div>
      <div><label>Penyusutan / thn</label><input type="text" name="penyusutan" readonly></div>
      <div>
        <label>Keterangan</label>
        <select name="keterangan" required>
          <option value="">Pilih</option>
          <option>Ada</option>
          <option>Hilang</option>
          <option>Rusak</option>
          <option>Dipinjam</option>
          <option>Dalam Perbaikan</option>
        </select>
      </div>
      <div><label>Dipinjam Oleh</label><input type="text" name="dipinjam" placeholder="Kosongkan jika tidak dipinjam"></div>
      <div><label>Penanggung Jawab</label><input type="text" name="penanggung" required></div>
      <div class="form-actions" style="grid-column: span 2;">
        <button type="button" onclick="tambahAset()">Tambah Aset Baru</button>
        <button type="button" onclick="exportExcel()">Simpan ke Excel Workbook</button>
      </div>
    </form>

    <table id="asetTable">
      <thead>
        <tr>
          <th>ID</th><th>Nama</th><th>Kategori</th><th>Status</th><th>Harga</th><th>Umur</th>
          <th>Penyusutan</th><th>Keterangan</th><th>Dipinjam Oleh</th><th>Penanggung Jawab</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2025 e-Sekolah | SIMAK-SD Develop By CV. Mitra Utama Consultindo</p>
  </footer>

  <script>
    function tambahAset() {
      const form = document.forms['asetForm'];
      const penyusutan = (parseInt(form.harga.value || 0) / parseInt(form.umur.value || 1)).toFixed(0);
      form.penyusutan.value = penyusutan;

      const data = [
        form.id.value, form.nama.value, form.kategori.value, form.status.value,
        form.harga.value, form.umur.value, penyusutan,
        form.keterangan.value, form.dipinjam.value, form.penanggung.value
      ];

      const tbody = document.querySelector('#asetTable tbody');
      const row = document.createElement('tr');
      data.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        row.appendChild(td);
      });
      tbody.appendChild(row);
      form.reset();
    }

    function exportExcel() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.table_to_sheet(document.getElementById('asetTable'));
      XLSX.utils.book_append_sheet(wb, ws, 'Aset Sekolah');
      XLSX.writeFile(wb, 'Data_Aset_Sekolah.xlsx');
    }
  </script>
</body>
</html>
