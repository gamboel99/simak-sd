<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Aset | SIMAK-SD</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>SIMAK-SD</h1>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="kepegawaian.html">Kepegawaian</a></li>
          <li><a href="aset.html" class="active">Manajemen Aset</a></li>
          <li><a href="laporan.html">Laporan</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Manajemen Aset</h2>
    <form id="formAset">
      <label for="nama">Nama Aset:</label>
      <input type="text" id="nama" name="nama" required>

      <label for="jumlah">Jumlah:</label>
      <input type="number" id="jumlah" name="jumlah" required>

      <label for="lokasi">Lokasi:</label>
      <input type="text" id="lokasi" name="lokasi" required>

      <button type="submit">Tambah Aset</button>
    </form>

    <h3>Data Aset</h3>
    <button onclick="downloadExcel()">Unduh Excel</button>
    <table id="tabelAset">
      <thead>
        <tr>
          <th>Nama Aset</th>
          <th>Jumlah</th>
          <th>Lokasi</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </main>

  <footer>
    <div class="container">
      <p>Developed by CV. Mitra Utama Consultindo</p>
    </div>
  </footer>

  <script>
    const form = document.getElementById('formAset');
    const tabel = document.querySelector('#tabelAset tbody');
    let data = [];

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const jumlah = document.getElementById('jumlah').value;
      const lokasi = document.getElementById('lokasi').value;

      const row = `<tr><td>${nama}</td><td>${jumlah}</td><td>${lokasi}</td></tr>`;
      tabel.innerHTML += row;

      data.push({ Nama_Aset: nama, Jumlah: jumlah, Lokasi: lokasi });
      form.reset();
    });

    function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, "DataAset");
      XLSX.writeFile(wb, "data_aset.xlsx");
    }
  </script>
</body>
</html>
