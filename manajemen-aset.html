<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Aset | e-Sekolah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sistem e-Sekolah</h1>
    <p>Manajemen Aset Sekolah</p>
  </header>

  <nav>
    <div class="container">
      <a href="index.html">Beranda</a>
      <a href="kepegawaian.html">Kepegawaian</a>
      <a href="manajemen-aset.html" class="active">Manajemen Aset</a>
      <a href="laporan.html">Laporan</a>
      <a href="kontak.html">Kontak</a>
    </div>
  </nav>

  <main class="container">
    <h2>Form Input Data Aset Sekolah</h2>
    <form id="form-aset" class="form-grid">
      <label for="id">ID Barang</label>
      <input type="text" id="id" name="id" required>

      <label for="nama">Nama Barang</label>
      <input type="text" id="nama" name="nama" required>

      <label for="jenis">Jenis Barang</label>
      <input type="text" id="jenis" name="jenis">

      <label for="tahun">Tahun Perolehan</label>
      <input type="number" id="tahun" name="tahun">

      <label for="harga">Harga Perolehan</label>
      <input type="number" id="harga" name="harga">

      <label for="umur">Umur Ekonomis (tahun)</label>
      <input type="number" id="umur" name="umur">

      <label for="penyusutan">Penyusutan per Tahun (otomatis)</label>
      <input type="text" id="penyusutan" name="penyusutan" readonly>

      <label for="status">Status Kepemilikan</label>
      <select id="status" name="status">
        <option>Beli</option>
        <option>Sewa</option>
        <option>Pinjam</option>
      </select>

      <label for="kondisi">Kondisi Barang</label>
      <select id="kondisi" name="kondisi">
        <option>Ada</option>
        <option>Dipinjam</option>
        <option>Hilang</option>
        <option>Rusak</option>
        <option>Dalam Perbaikan</option>
      </select>

      <label for="peminjam">Dipinjam Oleh</label>
      <input type="text" id="peminjam" name="peminjam">

      <label for="penanggung">Penanggung Jawab</label>
      <input type="text" id="penanggung" name="penanggung">

      <label for="catatan">Catatan Tambahan</label>
      <textarea id="catatan" name="catatan" rows="2"></textarea>

      <label for="tindakan">Status Rejuvenasi/Stok</label>
      <input type="text" id="tindakan" name="tindakan" readonly>
    </form>

    <button onclick="simpanDataAset()">💾 Simpan & Export Excel</button>
  </main>

  <footer>
    <p>&copy; 2025 e-Sekolah | Dikembangkan oleh SDI Ulumiyah Al-Makruf</p>
  </footer>

  <script src="aset.js"></script>
</body>
</html>
