<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Aset</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SIMAK SD | Manajemen Aset</h1>
  </header>

  <nav>
    <a href="kepegawaian.html">Kepegawaian</a>
    <a href="manajemen-aset.html" class="active">Manajemen Aset</a>
    <a href="laporan.html">Laporan</a>
    <a href="kontak.html">Kontak</a>
  </nav>

  <div class="container">
    <h2>Input Data Aset</h2>
    <form id="asetForm" class="form-grid">
      <label>ID Barang:</label><input type="text" name="id" required />
      <label>Nama Barang:</label><input type="text" name="nama" required />
      <label>Jenis:</label><input type="text" name="jenis" />
      <label>Harga Perolehan:</label><input type="number" name="harga" required />
      <label>Umur Ekonomis (thn):</label><input type="number" name="umur" required />
      <label>Metode Penyusutan:</label>
      <select name="penyusutan">
        <option value="garis">Garis Lurus</option>
        <option value="menurun">Saldo Menurun</option>
      </select>
      <label>Status Barang:</label>
      <select name="status">
        <option>Beli</option>
        <option>Sewa</option>
        <option>Pinjam</option>
      </select>
      <label>Kondisi:</label>
      <select name="kondisi">
        <option>Ada</option>
        <option>Hilang</option>
        <option>Rusak</option>
        <option>Dipinjam</option>
        <option>Dalam Perbaikan</option>
      </select>
      <label>Dipinjam oleh:</label><input type="text" name="dipinjam" />
      <label>Penanggung Jawab:</label><input type="text" name="pj" />
      <label>Perlu Peremajaan?:</label>
      <select name="remajakan">
        <option>Tidak</option>
        <option>Segera</option>
      </select>
      <label>Butuh Restok?:</label>
      <select name="restok">
        <option>Tidak</option>
        <option>Ya</option>
      </select>
      <button type="submit">➕ Simpan Data</button>
    </form>

    <h3>Data Aset Terkini</h3>
    <button onclick="downloadExcel()">⬇️ Download Excel</button>
    <table id="tabelAset">
      <thead>
        <tr>
          <th>ID</th><th>Nama</th><th>Jenis</th><th>Harga</th><th>Umur</th>
          <th>Metode</th><th>Penyusutan</th><th>Status</th><th>Kondisi</th>
          <th>Dipinjam</th><th>Penanggung Jawab</th><th>Peremajaan</th><th>Restok</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>
    &copy; 2025 SDI Ulumiyah Al-Makruf | Manajemen Aset Sekolah
  </footer>

  <script src="aset.js"></script>
</body>
</html>
