<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Aset</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>SIMAK SD | Manajemen Aset</h1>
  </header>

  <nav>
    <a href="kepegawaian.html">Kepegawaian</a>
    <a href="manajemen-aset.html" class="active">Manajemen Aset</a>
    <a href="laporan.html">Laporan</a>
    <a href="kontak.html">Kontak</a>
  </nav>

  <div class="container">
    <h2>Form Input Manajemen Aset Sekolah</h2>
    <form class="form-grid">
      <label>ID Barang:</label><input type="text" name="id_barang" />
      <label>Nama Barang:</label><input type="text" name="nama_barang" />
      <label>Jenis Barang:</label><input type="text" name="jenis_barang" />
      <label>Tanggal Perolehan:</label><input type="date" name="tanggal" />
      <label>Umur Ekonomis (tahun):</label><input type="number" name="umur" />
      <label>Metode Penyusutan:</label>
      <select name="penyusutan">
        <option>Garis Lurus</option>
        <option>Saldo Menurun</option>
      </select>
      <label>Status:</label>
      <select name="status">
        <option>Sewa</option>
        <option>Beli</option>
        <option>Pinjam</option>
      </select>
      <label>Kondisi:</label>
      <select name="kondisi">
        <option>Ada</option>
        <option>Hilang</option>
        <option>Rusak</option>
        <option>Dipinjam</option>
        <option>Dalam Perbaikan</option>
      </select>
      <label>Jika dipinjam, oleh siapa:</label><input type="text" name="dipinjam_oleh" />
      <label>Penanggung Jawab:</label><input type="text" name="penanggung_jawab" />
      <label>Perlu Peremajaan?:</label>
      <select name="peremajaan">
        <option>Tidak</option>
        <option>Segera</option>
      </select>
      <label>Butuh Restok?:</label>
      <select name="restok">
        <option>Tidak</option>
        <option>Ya</option>
      </select>
    </form>
    <button>🖫 Simpan ke Excel</button>
  </div>

  <footer>
    &copy; 2025 SDI Ulumiyah Al-Makruf | Sistem Manajemen Aset Sekolah
  </footer>
</body>
</html>
